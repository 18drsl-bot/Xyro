name = "xyro-api"
main = "worker.js"
compatibility_date = "2026-09-17"
workers_dev = true

# Public configuration. Nothing secret belongs in this file - the database URL
# is already public in the repo's firebase.json, so it is safe here.
[vars]
FB_URL     = "https://xyro-fcaf8-default-rtdb.firebaseio.com"
RAW_REPO   = "https://raw.githubusercontent.com/vertxxy-1/Xyro/main"
ALLOW_ORIGIN = "*"
# What GET /loader hands out. Point it at loadstring.lua for the hardened
# multi-mirror loader, or any file in the repo - it needs no deploy-time change
# beyond this line. custom-loader.lua is the API-only one: a client that uses it
# never touches GitHub at all.
LOADER_FILE = "custom-loader.lua"

# Secrets - set these with the CLI, they are stored encrypted in Cloudflare and
# are never written to this file or to the repo:
#
#   npx wrangler secret put XYRO_KEY          # the key clients and the bot send
#   npx wrangler secret put XYRO_ADMIN_KEY    # the owner key: blacklist + gate
#   npx wrangler secret put FB_SERVICE_ACCOUNT  # lets the Worker write staff/gate
#                                             # (paste the whole key file - see
#                                             # api/README.md section 4)
#   npx wrangler secret put FB_SECRET         # legacy alternative to the above
#   npx wrangler secret put XYRO_PUBLISH_KEY  # optional: a lesser key that can
#                                             # publish tag rules and nothing else.
#                                             # Set it if you would rather the key
#                                             # saved in the editor could not also
#                                             # trip the kill switch or edit the
#                                             # blacklist (api/README.md section 7).
#   npx wrangler secret put GH_TOKEN          # fine-grained repo token with
#                                             # Contents: Read and write. Optional:
#                                             # it makes the tag rules read straight
#                                             # from the never-cached GitHub API and
#                                             # turns on PUT /nametags (api/README.md
#                                             # section 7). Without it, reads fall
#                                             # back to cache-busted raw and
#                                             # publishing stays unavailable.
#
# Watch requests and errors live while testing:
#   npx wrangler tail
